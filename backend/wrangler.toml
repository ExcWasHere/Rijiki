name = "rijiki-backend"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
PUBLIC_ASSET_BASE_URL = "https://pub-5f21fb1a2c4245bba64085187a0fabc7.r2.dev"
MIDTRANS_ENV = "sandbox"

[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "rijiki-public"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "rijiki-private"

# Rate Limiting binding Cloudflare (per IP per menit). Sintaksnya masih lewat
# `unsafe.bindings` karena wrangler 3 belum punya kunci top-level sendiri.
[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "WEBHOOK_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }