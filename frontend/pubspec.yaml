name: rijiki
description: "Rijiki Shoe & Care."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.3.2
  go_router: ^14.6.2
  http: ^1.2.0
  flutter_secure_storage: ^10.0.0
  google_sign_in: ^7.0.0
  camera: ^0.12.0+2
  image_picker: ^1.2.4
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_rijiki.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_rijiki.png"